name: Apply and validate GitHub issue task sync

on:
  push:
    branches: ["issue-22-github-issue-sync"]
    paths:
      - ".github/workflows/apply-issue22-github-task-sync.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: issue-22-github-issue-sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source patch
        run: python3 scripts/apply-issue22-github-task-sync.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check repository privacy
        run: npm run check:privacy

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/Ariadne"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL: ${{ secrets.NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL }}
        run: npm run build

      - name: Check exported site privacy
        run: npm run check:privacy

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tasks/page.js app/globals.css supabase/functions/github-sync/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Implement GitHub issue task sync UI and backend"
            git push origin HEAD:issue-22-github-issue-sync
          fi
