name: Finalize Kleos extraction cutover

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Apply Kleos cutover
        run: |
          if [ ! -f app/lab/page.js ] && [ ! -d lib/lab ]; then
            echo "Kleos cutover already applied."
            exit 0
          fi

          python <<'PY'
          from pathlib import Path
          import re

          shell_path = Path("components/AppShell.jsx")
          shell = shell_path.read_text()
          shell = shell.replace('  { key: "lab", href: "/lab", label: "Lab", icon: "lab" }\n', '')
          shell = re.sub(
              r'\n  if \(icon === "lab"\) \{.*?\n  \}\n\n  if \(icon === "settings"\)',
              '\n  if (icon === "settings")',
              shell,
              flags=re.S,
          )
          if 'href: "/lab"' in shell or 'icon === "lab"' in shell:
              raise SystemExit("Failed to remove Lab navigation cleanly")
          shell_path.write_text(shell)

          schema_path = Path("supabase/schema.sql")
          schema = schema_path.read_text()
          start_marker = "-- 10) Private GOAT Lab storage, locked to the authorized account by RLS."
          end_marker = "-- 10) Durable owner-only cache for external dashboard signals"
          start = schema.find(start_marker)
          end = schema.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Could not locate the Ariadne GOAT Lab schema block")
          schema = schema[:start] + end_marker + schema[end + len(end_marker):]
          if "goat_" in schema:
              raise SystemExit("A goat_* schema reference remains in Ariadne schema.sql")
          schema_path.write_text(schema)

          css_path = Path("app/globals.css")
          css = css_path.read_text()

          def matching_brace(text, open_index):
              depth = 1
              i = open_index + 1
              quote = None
              escaped = False
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'"):
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise SystemExit("Unbalanced CSS braces")

          def clean_rules(text):
              out = []
              cursor = 0
              while True:
                  open_index = text.find("{", cursor)
                  if open_index == -1:
                      out.append(text[cursor:])
                      break
                  close_index = matching_brace(text, open_index)
                  header = text[cursor:open_index]
                  body = text[open_index + 1:close_index]
                  selector = header.strip()
                  if selector.startswith("@"):
                      cleaned_body = clean_rules(body)
                      if cleaned_body.strip():
                          out.append(header + "{" + cleaned_body + "}")
                  elif ".goat-" in selector or ".lab-" in selector:
                      pass
                  else:
                      out.append(header + "{" + body + "}")
                  cursor = close_index + 1
              return "".join(out)

          css = clean_rules(css)
          if ".goat-" in css or ".lab-" in css:
              raise SystemExit("Lab-only selectors remain in globals.css")
          css_path.write_text(css)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          final_boundary = (
              "## Kleos boundary\n\n"
              "Personal measurement and benchmarking are fully owned by the separate\n"
              "[`NeoLorenzo/Kleos`](https://github.com/NeoLorenzo/Kleos) application. Ariadne no longer exposes\n"
              "or contains the former GOAT Lab application surface.\n\n"
              "Existing `goat_*` records remain physically located in the shared Supabase project. Their schema,\n"
              "RLS policy definitions, application logic, and future persistence changes are owned by Kleos.\n"
          )
          readme, count = re.subn(
              r'## Kleos extraction status\n.*?(?=## Tech stack)',
              final_boundary + '\n',
              readme,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not replace transitional README extraction section")
          old_persistence = (
              "Kleos-owned `goat_*` persistence is documented and maintained in\n"
              "[`NeoLorenzo/Kleos`](https://github.com/NeoLorenzo/Kleos/tree/main/supabase). During the migration\n"
              "window, compatibility definitions may still remain in Ariadne's schema file; they should not be\n"
              "used as the source of truth for future Kleos changes."
          )
          new_persistence = (
              "Kleos-owned `goat_*` persistence is documented and maintained in\n"
              "[`NeoLorenzo/Kleos`](https://github.com/NeoLorenzo/Kleos/tree/main/supabase). Ariadne intentionally\n"
              "excludes Kleos persistence definitions from its own schema; the Kleos repository is the source of truth."
          )
          if old_persistence not in readme:
              raise SystemExit("Could not locate transitional persistence documentation")
          readme = readme.replace(old_persistence, new_persistence)
          readme_path.write_text(readme)

          for path in [
              Path("app/lab/page.js"),
              Path("lib/lab/goatLabData.js"),
              Path("lib/lab/goatPrompt.js"),
          ]:
              if path.exists():
                  path.unlink()
          for directory in [Path("app/lab"), Path("lib/lab")]:
              if directory.exists():
                  directory.rmdir()
          PY

          if grep -RInE 'app/lab|lib/lab|href: "/lab"|icon === "lab"' app components lib --exclude-dir=.next; then
            echo "A Lab application reference remains in Ariadne source."
            exit 1
          fi

          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run Ariadne validation
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/Ariadne"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL: ${{ secrets.NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL }}
        run: |
          npm test
          npm run check:privacy
          npm run build
          npm run check:privacy

      - name: Commit cutover
        run: |
          git config user.name "Lorenzo Roque Dal Fabbro"
          git config user.email "theneolorenzo@gmail.com"
          git add -A app components lib supabase README.md
          if git diff --cached --quiet; then
            echo "No cutover changes remain to commit."
            exit 0
          fi
          git commit -m "Finalize Kleos extraction cutover"
          git push origin HEAD:main
